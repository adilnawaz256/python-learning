# ===================================================================
# Telecom NOC Data Platform - Apache Spark Configuration
# ===================================================================

# --- Spark Cluster Configuration ---
spark.master                        spark://spark-master:7077
spark.app.name                      NOC-Spark-ETL-Processor
spark.driver.memory                 1g
spark.executor.memory               1g

# --- Hadoop S3A / MinIO Object Storage Configuration ---
spark.hadoop.fs.s3a.endpoint        http://minio:9000
spark.hadoop.fs.s3a.access.key      minioadmin
spark.hadoop.fs.s3a.secret.key      minioadmin
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.impl            org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# --- Maven Packages (MinIO S3A, Iceberg Runtime, Excel Reader) ---
spark.jars.packages                 org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,com.crealytics:spark-excel_2.12:3.5.0_0.20.4

# --- Apache Iceberg Catalog Configuration ---
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type      hadoop
spark.sql.catalog.iceberg.warehouse s3a://noc-raw-data/iceberg-warehouse

spark.sql.catalog.demo              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type         hadoop
spark.sql.catalog.demo.warehouse    s3a://noc-raw-data/iceberg-warehouse

# --- Logging & SQL Output Optimizations ---
spark.sql.shuffle.partitions        4
spark.debug.maxToStringFields       100

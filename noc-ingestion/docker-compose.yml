services:
  # 1. NOC Ingestion Python FastAPI Service
  noc-ingestion:
    image: noc-ingestion:1.0
    container_name: noc-ingestion-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=noc-ingestion
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET=noc-raw-data
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=telecom-events
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=noc_audit
      - MOCK_EXTERNAL_API_URL=http://mock-external-api:8001
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-external-api:
        condition: service_started
    restart: unless-stopped

  # 1b. Mock External REST API Service
  mock-external-api:
    image: noc-ingestion-mock-external-api:latest
    container_name: noc-mock-external-api
    ports:
      - "8001:8001"
    restart: unless-stopped

  # 2. MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: noc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 3. Apache Kafka (KRaft mode)
  kafka:
    image: apache/kafka:latest
    container_name: noc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 4. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: noc-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=noc_audit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noc_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 5. Apache Spark Master
  spark-master:
    image: spark:3.5.1-python3
    container_name: noc-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=noc-raw-data
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/spark-apps
      - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/config/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark_data:/opt/spark/work-dir
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 6. Apache Spark Worker
  spark-worker:
    image: spark:3.5.1-python3
    container_name: noc-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=noc-raw-data
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/spark-apps
      - ./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/config/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark_data:/opt/spark/work-dir
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  # 7. Apache Trino (SQL Query Engine for Apache Iceberg)
  trino:
    image: trinodb/trino:435
    container_name: noc-trino
    hostname: trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties
      - ./trino/node.properties:/etc/trino/node.properties
      - ./trino/jvm.config:/etc/trino/jvm.config
      - trino_data:/data/trino
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # 8. Grafana Dashboards Engine
  grafana:
    image: grafana/grafana:10.4.0
    container_name: noc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=trino
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - trino
    restart: unless-stopped

volumes:
  minio_data:
  kafka_data:
  postgres_data:
  spark_data:
  trino_data:
  grafana_data:
